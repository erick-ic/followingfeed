# FollowingFeed 本地开发依赖。
# 数据库表结构由 `make migrate-up` 执行版本化迁移创建。
services:
  mysql:
    image: mysql:8.0
    environment:
      # 初始化数据库和开发环境账号。
      MYSQL_DATABASE: followingfeed
      MYSQL_USER: followingfeed
      MYSQL_PASSWORD: ${FOLLOWINGFEED_MYSQL_PASSWORD:?请在 .env 中设置 FOLLOWINGFEED_MYSQL_PASSWORD}
      # 应用不使用 root；首次初始化时由 MySQL 自动生成 root 密码。
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"

    # 宿主机使用 13306，避免与本机已有 MySQL 占用 3306；
    # 容器内部的 MySQL 仍然监听 3306。
    ports: ["127.0.0.1:13306:3306"]

    volumes:
      # 持久化 MySQL 数据。删除容器后，表和数据仍会保留。
      - mysql_data:/var/lib/mysql

  redis:
    image: bitnami/redis:7.4
    environment:
      # 仅用于本地开发，Redis 不要求密码。
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      # Redis 默认端口。
      - '127.0.0.1:6379:6379'

# 声明命名数据卷。不要执行 `docker compose down -v`，除非确认要清空数据库。
volumes:
  mysql_data:
