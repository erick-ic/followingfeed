# FollowingFeed 本地完整演示环境。
# 业务服务默认启动；Prometheus 和 Grafana 需通过 observability Profile 按需启动。
# 密码、JWT 密钥等敏感值从根目录 .env 读取，不应直接写入本文件。
services:
  mysql:
    image: mysql:8.0
    environment:
      # 初始化数据库和开发环境账号。
      MYSQL_DATABASE: followingfeed
      MYSQL_USER: followingfeed
      MYSQL_PASSWORD: ${FOLLOWINGFEED_MYSQL_PASSWORD:?请在 .env 中设置 FOLLOWINGFEED_MYSQL_PASSWORD}
      # 应用不使用 root；首次初始化时由 MySQL 自动生成 root 密码。
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"

    # 宿主机使用 13306，避免与本机已有 MySQL 占用 3306；
    # 容器内部的 MySQL 仍然监听 3306。
    ports: ["127.0.0.1:13306:3306"]

    volumes:
      # 持久化 MySQL 数据。删除容器后，表和数据仍会保留。
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.7-alpine
    ports:
      # 只绑定本机回环地址，避免开发环境 Redis 暴露到局域网。
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    # 一次性数据库迁移任务，与 API 使用同一镜像但改用 migrate 入口程序。
    # 这里只传入迁移所需的 MySQL 配置，避免依赖 Redis、JWT 或 CORS。
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      # 容器使用生产运行模式，强制执行完整配置校验；这不代表本地环境是正式生产。
      FOLLOWINGFEED_ENV: production
      # Compose 服务名 mysql 可作为容器网络内的主机名。
      FOLLOWINGFEED_MYSQL_HOST: mysql
      FOLLOWINGFEED_MYSQL_PORT: 3306
      FOLLOWINGFEED_MYSQL_USER: followingfeed
      FOLLOWINGFEED_MYSQL_PASSWORD: ${FOLLOWINGFEED_MYSQL_PASSWORD:?请在 .env 中设置 FOLLOWINGFEED_MYSQL_PASSWORD}
      FOLLOWINGFEED_MYSQL_DATABASE: followingfeed
      # 单次迁移总超时，以及等待 MySQL 迁移锁的秒数。
      FOLLOWINGFEED_MIGRATION_TIMEOUT: ${FOLLOWINGFEED_MIGRATION_TIMEOUT:-30m}
      FOLLOWINGFEED_MIGRATION_LOCK_TIMEOUT: ${FOLLOWINGFEED_MIGRATION_LOCK_TIMEOUT:-30}
    depends_on:
      # MySQL 健康后才执行迁移，避免数据库仍在初始化时迁移失败。
      mysql:
        condition: service_healthy
    # 迁移成功或失败后均不自动重启，由 Compose 根据退出码决定是否继续启动 API。
    restart: "no"

  api:
    # Go 业务 API。数据库结构由 migrate 服务维护，API 启动时不会 AutoMigrate。
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FOLLOWINGFEED_ENV: production
      # 容器之间通过 Compose 服务名通信，不使用宿主机的 localhost。
      FOLLOWINGFEED_MYSQL_HOST: mysql
      FOLLOWINGFEED_MYSQL_PORT: 3306
      FOLLOWINGFEED_MYSQL_USER: followingfeed
      FOLLOWINGFEED_MYSQL_PASSWORD: ${FOLLOWINGFEED_MYSQL_PASSWORD:?请在 .env 中设置 FOLLOWINGFEED_MYSQL_PASSWORD}
      FOLLOWINGFEED_MYSQL_DATABASE: followingfeed
      FOLLOWINGFEED_MYSQL_CONNECT_TIMEOUT: 3s
      FOLLOWINGFEED_MYSQL_READ_TIMEOUT: 5s
      FOLLOWINGFEED_MYSQL_WRITE_TIMEOUT: 5s
      FOLLOWINGFEED_MYSQL_QUERY_TIMEOUT: 3s
      FOLLOWINGFEED_REDIS_ADDR: redis:6379
      FOLLOWINGFEED_RATE_LIMIT_WINDOW: ${FOLLOWINGFEED_RATE_LIMIT_WINDOW:-1s}
      FOLLOWINGFEED_RATE_LIMIT_THRESHOLD: ${FOLLOWINGFEED_RATE_LIMIT_THRESHOLD:-100}
      # 业务端口为 8080；Prometheus 指标使用独立的 8081 管理端口。
      FOLLOWINGFEED_OBSERVABILITY_METRICS_ADDR: ":8081"
      # Compose 在变量缺失时直接报错，避免以弱密钥启动服务。
      FOLLOWINGFEED_JWT_ACCESS_TOKEN_KEY: ${FOLLOWINGFEED_JWT_ACCESS_TOKEN_KEY:?请在 .env 中设置 FOLLOWINGFEED_JWT_ACCESS_TOKEN_KEY}
      FOLLOWINGFEED_JWT_REFRESH_TOKEN_KEY: ${FOLLOWINGFEED_JWT_REFRESH_TOKEN_KEY:?请在 .env 中设置 FOLLOWINGFEED_JWT_REFRESH_TOKEN_KEY}
      # 本地前端来源；正式部署时应替换为真实 HTTPS 域名。
      FOLLOWINGFEED_CORS_ALLOWED_ORIGINS: http://localhost:3000
      # 本地演示环境开启 Swagger UI；生产部署仍应默认关闭。
      FOLLOWINGFEED_SWAGGER_ENABLED: "true"
    ports:
      # 端口仅绑定本机：8080 提供 API，8081 提供 /metrics。
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      # 只有迁移成功且 Redis 健康时才启动 API。
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    # 可选指标采集服务：运行 `make observability-up` 才会启动。
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      # 配置和告警规则以只读方式挂载，修改后可重建容器生效。
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  grafana:
    # 可选监控大屏，从 Prometheus 查询指标并自动加载仓库内 Dashboard。
    profiles: ["observability"]
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # admin 仅适合本地；共享或生产环境必须通过 .env 覆盖。
      GF_SECURITY_ADMIN_PASSWORD: ${FOLLOWINGFEED_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # grafana_data 保存本地状态；provisioning 和 dashboards 由代码仓库统一维护。
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  web:
    # Next.js 前端。浏览器和服务端渲染处于不同网络环境，因此使用两个 API 地址。
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 写入浏览器端构建产物，浏览器通过宿主机 8080 访问 API。
        NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
    environment:
      NODE_ENV: production
      # Next.js 服务端在 Compose 网络内通过 api 服务名访问后端。
      INTERNAL_API_BASE: http://api:8080/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

# 声明命名数据卷。不要执行 `docker compose down -v`，除非确认要清空数据库。
volumes:
  mysql_data:
  grafana_data:
